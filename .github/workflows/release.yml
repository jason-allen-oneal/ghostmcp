name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write

    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked verification and release tooling
        run: |
          pip install --require-hashes -r requirements-dev.lock.txt
          pip install --require-hashes -r requirements-release.lock.txt
          pip install -e . --no-deps

      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import ghostmcp; print(ghostmcp.__version__)')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Run release gates
        run: |
          ruff check .
          mypy ghostmcp
          bandit -q -r ghostmcp
          pip-audit
          python -m pytest
          python -m compileall -q ghostmcp
          python -m pip check

      - name: Build release artifacts
        run: |
          python -m build
          python scripts/verify_distribution.py dist

      - name: Verify artifacts
        run: twine check dist/*

      - name: Generate checksums
        run: sha256sum dist/* > dist/SHA256SUMS

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.spdx.json
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.spdx.json

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl dist/*.tar.gz
